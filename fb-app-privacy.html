<h1>粉專發文工具隱私政策</h1>
<p>「林柏霖醫師粉專發文」是臉書粉絲專頁「一千個傷心的理由 Dr. Berlin」的管理工具，只由這個粉專的管理者使用，用來在這個粉專發布貼文與第一則留言。</p>
<p>這個工具不蒐集、不儲存、也不出售粉絲或訪客的個人資料，不讀取私人訊息，也不用於廣告。工具使用的存取權杖只保存在粉專管理者自己的電腦上。</p>
<p>如果您希望刪除與您相關的留言或資料，或對本政策有疑問，請私訊「一千個傷心的理由 Dr. Berlin」粉專，我們收到後會協助處理。</p>
