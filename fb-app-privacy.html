<style>body{max-width:640px;margin:40px auto;padding:0 16px;font:16px/1.8 system-ui,"Noto Sans TC",sans-serif;color:#222}h1{font-size:22px}</style><style id="lbcss">
/* 2026-11-26 分行（凱菲：「我要手机版的段落是对的」）：site/linebreak.py 在建置時把每個詞包成 .nb（不拆）、一小句包成 .cl（放不下整句換行），一個文字節點外面再包 .lb；父層寫給 span 的樣式（膠囊底色、display:block、字級…）一律不傳進來，看起來跟原本一樣 */
.nb,.lb{display:inline!important;font:inherit!important;color:inherit!important;background:none!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:0!important;margin:0!important;letter-spacing:inherit!important;text-transform:inherit!important;transform:none!important;flex:0 1 auto!important;min-width:auto!important;max-width:none!important;width:auto!important;height:auto!important;overflow:visible!important;text-overflow:clip!important;position:static!important;opacity:1!important;vertical-align:baseline!important}
.nb{white-space:nowrap!important}.lb{white-space:inherit!important}
.cl{display:inline-block!important;max-width:100%!important;text-indent:0!important;font:inherit!important;color:inherit!important;background:none!important;border:0!important;border-radius:0!important;padding:0!important;margin:0!important;box-shadow:none!important;transform:none!important;vertical-align:baseline!important;white-space:normal!important;position:static!important;flex:0 1 auto!important;letter-spacing:inherit!important}
.nstats span,.hfoot span,.nsc span,.ntxt b,.ntxt small,.nsum b,.nsum small,.shelf b,.shelf small,.plist b,.nqs a,.video h3,.tile b,.btn,.chips a,.badges span,.days span,figcaption,summary,dt,th{text-wrap:balance}
/* 論文頁「2016–2026」原本的方塊太窄、一定被折斷：方塊至少 230px，放不下就換成一欄 */
.stats{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))!important}.stats strong{white-space:nowrap}
/* 首頁「影片」排四欄時，電腦版每張卡的文字只剩 78px、標題被擠碎：每欄至少 220px，放不下就自動變兩欄 */
.nbody .videos{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))!important}
/* 論文頁「其他期刊論文」：連結裡只有標題、沒有日期時，標題原本被塞進 4.6 字寬的日期欄；改成佔滿整列 */
.alist a>.lb:only-child{grid-column:1/-1}
/* 參考文獻的長英文字、網址：放不下就斷開，不撐出框（原本就有 3～7px 超出） */
.srcs li,.srcs a{overflow-wrap:anywhere}

<h1><span class="lb"><span class="nb">粉專</span><span class="nb">發文</span><span class="nb">工具</span><span class="nb">隱私政策</span></span></h1>
<p><span class="lb"><span class="cl"><span class="nb">「林柏霖醫師</span><span class="nb">粉專</span><span class="nb">發文」</span></span><span class="nb">是臉書</span><span class="nb">粉絲專頁</span><span class="nb">「一千個</span><span class="nb">傷心的</span><span class="nb">理由</span> Dr. Berlin」<span class="nb">的管理工具，</span><span class="cl"><span class="nb">只由</span><span class="nb">這個</span><span class="nb">粉專的</span><span class="nb">管理者</span><span class="nb">使用，</span></span><span class="nb">用來</span><span class="nb">在這個</span><span class="nb">粉專</span><span class="nb">發布</span><span class="nb">貼文</span><span class="nb">與第一則留言。</span></span></p>
<p><span class="lb"><span class="cl"><span class="nb">這個</span><span class="nb">工具</span><span class="nb">不蒐集、</span></span><span class="nb">不儲存、</span><span class="nb">也不</span><span class="nb">出售</span><span class="nb">粉絲</span><span class="nb">或訪客的</span><span class="nb">個人資料，</span><span class="cl"><span class="nb">不讀取</span><span class="nb">私人</span><span class="nb">訊息，</span></span><span class="cl"><span class="nb">也不</span><span class="nb">用於</span><span class="nb">廣告。</span></span><span class="nb">工具</span><span class="nb">使用的</span><span class="nb">存取</span><span class="nb">權杖</span><span class="nb">只保存</span><span class="nb">在粉專</span><span class="nb">管理者</span><span class="nb">自己的</span><span class="nb">電腦上。</span></span></p>
<p><span class="lb"><span class="nb">如果</span><span class="nb">您希望</span><span class="nb">刪除</span><span class="nb">與您</span><span class="nb">相關的</span><span class="nb">留言</span><span class="nb">或資料，</span><span class="cl"><span class="nb">或對</span><span class="nb">本政策</span><span class="nb">有疑問，</span></span><span class="nb">請私訊</span><span class="nb">「一千個</span><span class="nb">傷心的</span><span class="nb">理由</span> Dr. Berlin」<span class="nb">粉專，</span><span class="cl"><span class="nb">我們</span><span class="nb">收到後</span><span class="nb">會協助處理。</span></span></span></p>
