<style>:root{--bg:#0a1a33;--bg2:#0e2547;--ink:#f7f9fc;--ink2:#d3deee;--muted:#a9bbd4;--cyan:#5fd0ff;--amber:#ffcf70;--coral:#ff8a7a;--line:rgba(255,255,255,.14);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:EduTC,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#vp{position:relative;overflow:hidden;flex:0 0 auto}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.ar169#stage{width:1920px;height:1080px}
.ar916#stage{width:1080px;height:1920px}
#bg{position:absolute;inset:0}
#bg i{position:absolute;border-radius:50%;filter:blur(0);opacity:.55}
#bgA{width:1400px;height:1400px;background:radial-gradient(closest-side,rgba(48,140,230,.45),rgba(48,140,230,0))}
#bgB{width:1300px;height:1300px;background:radial-gradient(closest-side,rgba(120,80,200,.38),rgba(120,80,200,0))}
#bgC{width:900px;height:900px;background:radial-gradient(closest-side,rgba(255,138,122,.16),rgba(255,138,122,0))}
/* 2026-10-03 iPhone「重複發生問題」（記憶體爆）：隱藏的幕用 display:none 拿出渲染樹，不再每幕都占一張圖層 */
.layer{position:absolute;inset:0;display:none}
.layer.on{display:block}
.art{position:absolute}
.ar169 .art{left:960px;top:90px;width:900px;height:900px}
.ar916 .art{left:80px;top:100px;width:920px;height:920px}
.art svg{width:100%;height:100%;overflow:visible;display:block}
.txt{position:absolute;display:flex;flex-direction:column;justify-content:center}
.ar169 .txt{left:110px;top:40px;width:830px;height:1000px}
.ar916 .txt{left:70px;top:1045px;width:940px;height:840px}
.eyebrow{display:inline-flex;max-width:100%;align-self:flex-start;align-items:center;gap:.5em;font-weight:500;color:var(--cyan);letter-spacing:.06em;border:2px solid rgba(95,208,255,.45);border-radius:999px;padding:.32em .85em;line-height:1;margin-bottom:.7em;white-space:nowrap}
.ar169 .eyebrow{font-size:34px}.ar916 .eyebrow{font-size:46px}

.eyebrow.tone-trad,.eyebrow.tone-lp{font-weight:800;letter-spacing:.04em;border-width:3px}
.eyebrow.tone-trad{background:#ffcf70;color:#2b1c00;border-color:#ffe2a6}
.eyebrow.tone-lp{background:linear-gradient(100deg,#4cc6ff 0%,#4cc6ff 40%,#e9fbff 50%,#4cc6ff 60%,#4cc6ff 100%);background-size:300% 100%;background-position:130% 0;color:#04203d;border-color:#bff0ff}
.ar169 .eyebrow.tone-trad,.ar169 .eyebrow.tone-lp{font-size:38px}.ar916 .eyebrow.tone-trad,.ar916 .eyebrow.tone-lp{font-size:50px}
.main{font-weight:800;line-height:1.42;letter-spacing:.02em;color:var(--ink)}
.ar169 .main{font-size:68px}.ar916 .main{font-size:100px}
.main .ln,.sub .ln{display:block;white-space:nowrap}
.main .ch{display:inline-block}
.sub{font-weight:500;color:var(--ink2);line-height:1.72;margin-top:.8em;letter-spacing:.02em}
.ar169 .sub{font-size:40px}.ar916 .sub{font-size:60px}
.fine{font-weight:500;color:var(--muted);margin-top:1.1em;white-space:nowrap}
.ar169 .fine{font-size:28px}.ar916 .fine{font-size:40px}
.card .main{font-weight:900;line-height:1.36}
.ar169 .card .main{font-size:88px}.ar916 .card .main{font-size:100px}
.card .note{font-weight:500;color:var(--ink2);margin-top:.9em;white-space:nowrap}
.ar169 .card .note{font-size:38px}.ar916 .card .note{font-size:52px}
.hl{color:var(--amber)}
.mode-video .itext{display:none}.mode-int .card{display:none}
svg text{font-family:EduTC,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#nav{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 12px 12px;width:100%}
#nav button{font:inherit;font-weight:700;font-size:22px;color:var(--ink);background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22);border-radius:16px;min-height:60px;padding:0 20px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto}
#nav button:active{transform:scale(.97)}
#nav button.primary{background:#2d8fe0;border-color:#5fd0ff;color:#fff}
#nav button[disabled]{opacity:.35}
#dots{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:20px;font-weight:700;min-width:5.2em;justify-content:center}
#dots b{color:var(--ink);font-size:24px}
.mode-video #nav{display:none}
@media (max-width:680px){#nav{gap:8px;padding:8px}#nav button{font-size:19px;padding:0 13px;min-height:56px}#nav .lbl{display:none}#nav .primary .lbl{display:inline}}

.clipart .art{overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 88%,transparent 100%),linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 7%,#000 88%,transparent 100%),linear-gradient(to right,transparent 0,#000 9%,#000 91%,transparent 100%);mask-composite:intersect}
/* 2026-10-12 轉場光帶（transFX 控制位置與透明度；平常 display:none） */
.sweep{position:absolute;inset:0;display:none;pointer-events:none;z-index:5;mix-blend-mode:screen;background:linear-gradient(105deg,transparent 30%,rgba(120,200,255,.10) 42%,rgba(190,235,255,.42) 50%,rgba(120,200,255,.10) 58%,transparent 70%)}
</style>
</head><body>

/* 6A-2 / 6A-3: one vessel, two stories. Tube (a vein, longitudinal section) on the left, heart on the right. */

function leadPath(y, end) { // along the lumen, then into the heart (RV leads pass the tricuspid valve)

/* 6B: 小房 calls, 小室 follows (duet) / conduct first, help only when needed */
